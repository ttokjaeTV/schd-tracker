name: SCHD 데이터 자동 갱신

on:
  schedule:
    # 매일 한국시간 08:30 (UTC 23:30). Schwab은 보통 미국 장 마감 후 배당을 발표한다.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      force_holdings:
        description: "구성종목을 날짜와 관계없이 다시 받기"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: schd-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 데이터 수집
        run: |
          if [ "${{ inputs.force_holdings }}" = "true" ]; then
            python scripts/update.py --force-holdings
          else
            python scripts/update.py
          fi

      - name: 엑셀 다시 만들기 (데이터가 바뀐 경우만)
        if: hashFiles('.run/changed') != ''
        run: python scripts/build_xlsx.py

      - name: 커밋
        if: hashFiles('.run/changed') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data downloads
          git commit -m "데이터 갱신: $(cat .run/changed) ($(TZ=Asia/Seoul date +%F))"
          git push

      - name: 새 배당 알림 이슈
        if: hashFiles('.run/new_dividend.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "SCHD 새 배당 반영 ($(TZ=Asia/Seoul date +%F))" --body-file .run/new_dividend.md

      - name: 확인 필요 알림 이슈
        if: hashFiles('.run/errors.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="SCHD 자동 갱신 확인 필요 ($(TZ=Asia/Seoul date +%F))"
          # 같은 날 같은 제목 이슈가 이미 있으면 새로 만들지 않음
          if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
            gh issue create --title "$title" --body-file .run/errors.md
          fi
